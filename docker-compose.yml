services:
  postgres:
    image: postgres:18-alpine
    container_name: news-paper-reader-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: social_listening
      POSTGRES_PASSWORD: socialListeningPassword
      POSTGRES_DB: social_listening
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U social_listening"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
